name: Deploy

on:
  push:
    branches: [dev]
    tags: ['v*']          # release to prod = push a v1.2.3 tag
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        type: choice
        options: [dev, prod]
        required: true

permissions:
  id-token: write   # OIDC token for AWS role assumption — no stored keys
  contents: read

env:
  AWS_REGION: eu-central-1
  # v* tag → prod, dev branch push → dev; manual dispatch picks explicitly
  DEPLOY_ENV: ${{ inputs.environment || (github.ref_type == 'tag' && 'prod' || 'dev') }}

concurrency:
  group: deploy-${{ inputs.environment || (github.ref_type == 'tag' && 'prod' || 'dev') }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment || (github.ref_type == 'tag' && 'prod' || 'dev') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Secret (not a repo variable) so the account id is masked in public logs
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Lambda packages
        run: ./scripts/build-lambdas.sh "$DEPLOY_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: terraform/environments/${{ env.DEPLOY_ENV }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false -backend-config="bucket=sdbx-terraform-state-${ACCOUNT_ID}"
          terraform validate
          terraform apply -input=false -auto-approve -lock-timeout=5m

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: /${{ env.DEPLOY_ENV }}
        run: |
          # tag push → tag is the version; dev push → short commit sha
          export VITE_APP_VERSION=$([ "$GITHUB_REF_TYPE" = "tag" ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA::7}")
          echo "Version: $VITE_APP_VERSION"
          npm ci
          npm run build

      - name: Publish frontend to S3 + invalidate CloudFront
        working-directory: terraform/environments/${{ env.DEPLOY_ENV }}
        run: |
          BUCKET=$(terraform output -raw static_bucket_name)
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          aws s3 sync ../../../frontend/dist/ "s3://${BUCKET}/" --delete
          # sw.js and the manifest must never be cached long, or PWA updates lag
          aws s3 cp ../../../frontend/dist/sw.js "s3://${BUCKET}/sw.js" --cache-control "no-cache" || true
          aws s3 cp ../../../frontend/dist/manifest.webmanifest "s3://${BUCKET}/manifest.webmanifest" --cache-control "no-cache" || true
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

          APP_URL="https://$(terraform output -raw cloudfront_domain)"
          echo "App deployed: $APP_URL"
          {
            echo "## 🚀 ${DEPLOY_ENV} deployed ($([ "$GITHUB_REF_TYPE" = "tag" ] && echo "$GITHUB_REF_NAME" || echo "${GITHUB_SHA::7}"))"
            echo "- App: $APP_URL"
            echo "- API: $(terraform output -raw api_endpoint)"
          } >> "$GITHUB_STEP_SUMMARY"
