version: 2

project_name: sdbx

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/sdbx
    binary: sdbx
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

brews:
  - repository:
      owner: AntonAks
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://securedbx.com"
    description: "Zero-knowledge file sharing CLI — encrypt, share, self-destruct"
    license: "MIT"
    test: |
      system "#{bin}/sdbx", "version"
